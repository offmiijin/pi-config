# CI — portabilidade das extensões do pi
#
# Jobs:
#   1. unit-tests     — todas as suítes (vitest + node) + typecheck + doctor smoke
#   2. install-clean  — instalação limpa via install.sh (deps, landlock, pi)
#   3. distro-matrix  — install.sh dentro de Ubuntu/Fedora/Arch (pm nativo),
#                       cobrindo os mapeamentos de pacote por distro

name: CI

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  unit-tests:
    name: Testes unitários (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instala dependências (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Instala bubblewrap/ripgrep (p/ teste memory + doctor smoke)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - name: pi-sandbox (vitest)
        run: npm run test:pi-sandbox
      - name: pi-github (vitest)
        run: npm run test:github
      - name: pi-web-search (vitest)
        run: npm run test:websearch
      - name: pi-panels (vitest)
        run: npm run test:pi-panels
      - name: Typecheck pi-panels
        run: npm run typecheck:pi-panels
      - name: pi-memory (node --test)
        run: npm run test:memory
      - name: doctor (vitest)
        run: npm run test:pi-doctor
      - name: Typecheck pi-sandbox
        run: npm run typecheck
      - name: Doctor smoke — ambiente completo sem pendências
        run: npm run doctor:check

  install-clean:
    name: Instalação limpa (install.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust estável (p/ landlock-exec)
        uses: dtolnay/rust-toolchain@stable
      - name: Roda install.sh --yes (copia config → ~/.pi/agent, deps, landlock)
        run: ./install.sh --yes
      - name: Verifica artefatos gerados em ~/.pi/agent
        run: |
          test -d ~/.pi/agent/node_modules/@earendil-works/pi-coding-agent
          test -d ~/.pi/agent/node_modules/typebox
          test -x ~/.pi/agent/extensions/pi-sandbox/landlock-exec-x86_64
          test -s ~/.pi/agent/extensions/pi-sandbox/seccomp.bpf
          test -f ~/.pi/agent/settings.json
          test -d ~/.pi/agent/themes
          test -d ~/.pi/agent/skills
          echo "artefatos OK"
      - name: Doctor smoke — sem pendências
        run: cd ~/.pi/agent && npm run doctor:check
      - name: Instala pi (mise) e valida binário
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          install: true
      - name: pi --version
        run: mise install pi@0.84.0 && mise exec pi@0.84.0 -- pi --version

  distro-matrix:
    name: Portabilidade (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            update: apt-get update && apt-get install -y ca-certificates curl python3 python3-venv
            node_setup: curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y nodejs
          - name: Fedora 43
            image: fedora:43
            update: dnf -y makecache
            node_setup: dnf install -y ca-certificates curl python3 python3-pip && curl -fsSL https://rpm.nodesource.com/setup_24.x | bash - && dnf install -y nodejs
          - name: Arch Linux
            image: archlinux:latest
            update: pacman -Syu --noconfirm ca-certificates python
            node_setup: pacman -S --noconfirm nodejs npm
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --yes no container (${{ matrix.name }} — pm nativo)
        run: |
          set -e
          rm -rf /tmp/ci-copy && cp -r . /tmp/ci-copy
          docker run --rm --privileged -v /tmp/ci-copy:/app -w /app "${{ matrix.image }}" \
            bash -c 'set -euo pipefail && ${{ matrix.update }} && ${{ matrix.node_setup }} && ./install.sh --yes && \
              test -d ~/.pi/agent/node_modules/@earendil-works/pi-coding-agent && \
              test -d ~/.pi/agent/node_modules/typebox && \
              test -s ~/.pi/agent/extensions/pi-sandbox/seccomp.bpf && \
              test -f ~/.pi/agent/settings.json && \
              cd ~/.pi/agent && PI_SANDBOX_REQUIRE_INTEGRATION=1 npm run test:pi-sandbox && \
              echo "OK: ${{ matrix.name }} — deps e sandbox real validados"'
