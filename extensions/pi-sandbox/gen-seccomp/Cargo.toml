[package]
name = "gen-seccomp"
version = "0.1.0"
edition = "2021"
description = "Gera filtro seccomp BPF para o pi-sandbox do pi. Usa libseccomp para compilar regras em bytecode que o kernel carrega via bwrap --seccomp."

[dependencies]
libseccomp = "0.3"
libc = "0.2"

[[bin]]
name = "gen-seccomp"
path = "src/main.rs"

[[bin]]
name = "landlock-exec"
path = "src/landlock_exec.rs"
